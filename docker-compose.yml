services:
  postgres:
    image: postgres:16-alpine
    container_name: zion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zion
      POSTGRES_USER: zion
      POSTGRES_PASSWORD: zion_dev_password
    ports:
      - "5432:5432"
    volumes:
      - zion-postgres-data:/var/lib/postgresql/data

volumes:
  zion-postgres-data:
